<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="RCP — rejestracja czasu pracy dla wielu firm" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <title>RCP</title>
</head>
<body>
  <div id="app"></div>
  <noscript>Ta aplikacja wymaga włączonego JavaScript.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script>
    (() => {
      const supabaseLib = window.supabase;
      if (!supabaseLib?.createClient) return;
      const originalCreateClient = supabaseLib.createClient.bind(supabaseLib);
      supabaseLib.createClient = function(...args) {
        const client = originalCreateClient(...args);
        const originalInvoke = client.functions.invoke.bind(client.functions);
        client.functions.invoke = async function(name, options = {}) {
          const isAdminPinStatus = name === 'employee-auth' && options?.body?.action === 'admin_pin_status';
          if (!isAdminPinStatus) return originalInvoke(name, options);

          let primary;
          try {
            primary = await originalInvoke(name, options);
            if (!primary?.error) return primary;
          } catch (error) {
            primary = { data: null, error };
          }

          try {
            const { data, error } = await client.rpc('admin_pin_status_fallback');
            if (!error) {
              return { data: { ok: true, configured: data === true }, error: null };
            }
          } catch (_) {}

          return primary;
        };
        return client;
      };
    })();
  </script>
  <script src="./loader.js" defer></script>
  <script src="./comments.js" defer></script>
</body>
</html>
